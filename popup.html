<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <h1>🍪 <span data-i18n="title">Cookie Manager</span></h1>
        <div class="lang-switch">
          <button id="lang-toggle" class="btn-text">中文 / EN</button>
        </div>
      </div>
      <div class="domain-info">
        <!-- Added domain selector for subdomain support -->
        <select id="domain-selector" class="domain-selector">
          <option value="" data-i18n="loading">Loading...</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="add-cookie" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="addCookie">Add Cookie</span>
      </button>
      <button id="import-cookies" class="btn btn-tonal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        <span data-i18n="importCookies">Import</span>
      </button>
      <button id="export-cookies" class="btn btn-tonal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        <span data-i18n="exportCookies">Export</span>
      </button>
      <div class="actions-right">
        <button id="refresh" class="btn btn-secondary btn-icon" title="Refresh" data-i18n-title="refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
        </button>
        <button id="clear-all" class="btn btn-danger-soft btn-icon" title="Clear All" data-i18n-title="clearAll">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="search" placeholder="Search cookies..." data-i18n-placeholder="searchPlaceholder">
    </div>

    <div class="cookie-list" id="cookie-list">
      <div class="loading" data-i18n="loading">Loading cookies...</div>
    </div>

    <!-- Add/Edit Cookie Modal -->
    <div id="cookie-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title" data-i18n="modalAddTitle">Add Cookie</h3>
          <span class="close">&times;</span>
        </div>
        <div class="modal-body">
          <form id="cookie-form">
            <div class="form-group">
              <label for="cookie-name"><span data-i18n="name">Name</span> *</label>
              <input type="text" id="cookie-name" required>
            </div>
            <div class="form-group">
              <label for="cookie-value"><span data-i18n="value">Value</span> *</label>
              <textarea id="cookie-value" required></textarea>
            </div>
            <div class="form-group">
              <label for="cookie-domain" data-i18n="domain">Domain</label>
              <input type="text" id="cookie-domain" placeholder="e.g., .example.com">
            </div>
            <div class="form-group">
              <label for="cookie-path" data-i18n="path">Path</label>
              <input type="text" id="cookie-path" value="/" placeholder="/">
            </div>
            <div class="form-group">
              <label for="cookie-expires" data-i18n="expiration">Expiration</label>
              <input type="datetime-local" id="cookie-expires">
            </div>
            <div class="form-group checkbox-group">
              <label>
                <input type="checkbox" id="cookie-secure"> <span data-i18n="secure">Secure</span>
              </label>
              <label>
                <input type="checkbox" id="cookie-httponly"> <span data-i18n="httpOnly">HttpOnly</span>
              </label>
              <label>
                <input type="checkbox" id="cookie-session"> <span data-i18n="session">Session Cookie</span>
              </label>
            </div>
            <div class="form-group">
              <label for="cookie-samesite" data-i18n="sameSite">SameSite</label>
              <select id="cookie-samesite">
                <option value="no_restriction">None</option>
                <option value="lax" selected>Lax</option>
                <option value="strict">Strict</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" id="save-cookie" class="btn btn-primary" data-i18n="save">Save</button>
          <button type="button" id="cancel-cookie" class="btn btn-secondary" data-i18n="cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Import Modal -->
    <div id="import-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 data-i18n="modalImportTitle">Batch Import Cookies</h3>
          <span class="close-import close">&times;</span>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label data-i18n="importFromFile">Import from JSON file</label>
            <input type="file" id="import-file" accept=".json,application/json" hidden>
            <button type="button" id="import-file-btn" class="file-picker">
              <span class="file-picker-icon">📄</span>
              <span class="file-picker-text">
                <span id="file-picker-label" data-i18n="chooseFile">Click to select a JSON file</span>
                <span class="file-picker-hint" data-i18n="orPasteBelow">or paste JSON content below</span>
              </span>
            </button>
          </div>
          <div class="form-group">
            <label for="import-json"><span data-i18n="jsonData">JSON Data</span> *</label>
            <textarea id="import-json" class="import-textarea" placeholder='[{"name":"cookie1","value":"value1"},{"name":"cookie2","value":"value2"}]'></textarea>
            <div class="form-hint" data-i18n="importHint">
              Format: JSON array of cookie objects. Required fields: name, value. Optional: domain, path, secure, etc.
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="do-import" class="btn btn-primary" data-i18n="import">Import</button>
          <button type="button" id="cancel-import" class="btn btn-secondary" data-i18n="cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="locales/en.js"></script>
  <script src="locales/zh.js"></script>
  <script src="popup.js"></script>
</body>
</html>
